# Deploy a Servidor Local (192.168.15.80)
# CI/CD Pipeline para deployment local con Docker

name: Deploy Local

on:
  push:
    branches: [ main, develop, release/* ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '18'
  SERVER_IP: '192.168.15.80'
  DEPLOY_DIR: '/opt/conectados-factura'

jobs:
  # ============================================
  # Code Quality Checks
  # ============================================
  lint:
    runs-on: ubuntu-latest
    name: Lint & Format Check
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        cd backend && npm ci
        cd ../frontend && npm ci
        
    - name: Run ESLint
      run: |
        cd backend && npm run lint || true
        cd ../frontend && npm run lint || true
        
    - name: Check formatting
      run: |
        cd backend && npm run format:check || true
        cd ../frontend && npm run format:check || true

  # ============================================
  # Tests
  # ============================================
  test:
    runs-on: ubuntu-latest
    name: Unit & Integration Tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        cd backend && npm ci
        cd ../frontend && npm ci
        
    - name: Run backend tests
      run: |
        cd backend
        npm test -- --coverage --coverageReporters=lcov || true
        
    - name: Run frontend tests
      run: |
        cd frontend
        npm test -- --coverage --coverageReporters=lcov --watchAll=false || true
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        directory: ./backend/coverage
        flags: backend
        
    - name: Upload frontend coverage
      uses: codecov/codecov-action@v3
      with:
        directory: ./frontend/coverage
        flags: frontend

  # ============================================
  # Security Scan
  # ============================================
  security:
    runs-on: ubuntu-latest
    name: Security Audit
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Run npm audit
      run: |
        cd backend && npm audit --audit-level high || true
        cd ../frontend && npm audit --audit-level high || true
        
    - name: Run Snyk security scan
      uses: snyk/actions/node@master
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high --file=backend/package.json
        
    - name: Run CodeQL Analysis
      uses: github/codeql-action/init@v2
      with:
        languages: javascript
        
    - name: Autobuild
      uses: github/codeql-action/autobuild@v2
      
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2

  # ============================================
  # Build Docker Images
  # ============================================
  build:
    runs-on: ubuntu-latest
    name: Build Docker Images
    needs: [lint, test, security]
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: false
        load: true
        tags: factura-app:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Build frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: false
        load: true
        tags: factura-frontend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Test images
      run: |
        docker run --rm factura-app:${{ github.sha }} node -e "console.log('Backend OK')"
        docker run --rm factura-frontend:${{ github.sha }} ls /app
        
    - name: Save images
      run: |
        docker save factura-app:${{ github.sha }} > factura-app.tar
        docker save factura-frontend:${{ github.sha }} > factura-frontend.tar
        
    - name: Upload images
      uses: actions/upload-artifact@v4
      with:
        name: docker-images
        path: |
          factura-app.tar
          factura-frontend.tar
        retention-days: 1

  # ============================================
  # Deploy to Local Server
  # ============================================
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Local Server
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/')
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download images
      uses: actions/download-artifact@v4
      with:
        name: docker-images
        path: ./images
        
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        
    - name: Add server to known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ env.SERVER_IP }} >> ~/.ssh/known_hosts
        
    - name: Transfer images to server
      run: |
        scp ./images/factura-app.tar deploy@${{ env.SERVER_IP }}:/tmp/
        scp ./images/factura-frontend.tar deploy@${{ env.SERVER_IP }}:/tmp/
        
    - name: Deploy on server
      run: |
        ssh deploy@${{ env.SERVER_IP }} << 'EOF'
          set -e
          
          echo "Loading Docker images..."
          docker load < /tmp/factura-app.tar
          docker load < /tmp/factura-frontend.tar
          
          cd ${{ env.DEPLOY_DIR }}
          
          echo "Tagging images..."
          docker tag factura-app:${{ github.sha }} factura-app:latest
          docker tag factura-frontend:${{ github.sha }} factura-frontend:latest
          
          echo "Running deploy script..."
          ./deploy.sh deploy
          
          echo "Cleaning up..."
          rm /tmp/factura-app.tar /tmp/factura-frontend.tar
        EOF
        
    - name: Health check
      run: |
        sleep 30
        ssh deploy@${{ env.SERVER_IP }} << 'EOF'
          cd ${{ env.DEPLOY_DIR }}
          ./deploy.sh health
        EOF
        
    - name: Notify success
      if: success()
      run: |
        echo "✅ Deployed successfully to ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}"
        # curl -X POST -H 'Content-type: application/json' \
        #   --data '{"text":"✅ Deploy successful!"}' \
        #   ${{ secrets.SLACK_WEBHOOK_URL }}
        
    - name: Notify failure
      if: failure()
      run: |
        echo "❌ Deploy failed!"
        ssh deploy@${{ env.SERVER_IP }} << 'EOF'
          cd ${{ env.DEPLOY_DIR }}
          ./deploy.sh rollback
        EOF
        # curl -X POST -H 'Content-type: application/json' \
        #   --data '{"text":"❌ Deploy failed, rollback executed"}' \
        #   ${{ secrets.SLACK_WEBHOOK_URL }}

  # ============================================
  # Smoke Tests
  # ============================================
  smoke-tests:
    runs-on: ubuntu-latest
    name: Smoke Tests
    needs: [deploy]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run smoke tests
      run: |
        BASE_URL="http://${{ env.SERVER_IP }}"
        
        # Test health endpoint
        curl -sf "${BASE_URL}/health" || exit 1
        
        # Test API
        curl -sf "${BASE_URL}/api/health" || exit 1
        
        # Test frontend
        curl -sf "${BASE_URL}" | grep -q "Conectados" || exit 1
        
        echo "✅ All smoke tests passed!"

  # ============================================
  # E2E Tests
  # ============================================
  e2e-tests:
    runs-on: ubuntu-latest
    name: E2E Tests
    needs: [smoke-tests]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        cd e2e
        npm ci
        
    - name: Install Playwright
      run: |
        cd e2e
        npx playwright install --with-deps
        
    - name: Run E2E tests
      run: |
        cd e2e
        BASE_URL="http://${{ env.SERVER_IP }}" npm test
      continue-on-error: true
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: e2e/playwright-report/
        retention-days: 30

  # ============================================
  # Performance Tests
  # ============================================
  performance:
    runs-on: ubuntu-latest
    name: Performance Tests
    needs: [smoke-tests]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Artillery
      run: npm install -g artillery
      
    - name: Run performance tests
      run: |
        artillery run \
          --target "http://${{ env.SERVER_IP }}" \
          --output performance-report.json \
          artillery-config.yml || true
          
    - name: Generate report
      run: |
        artillery report performance-report.json -o performance-report.html || true
        
    - name: Upload performance report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-report
        path: |
          performance-report.json
          performance-report.html
        retention-days: 30

  # ============================================
  # Cleanup
  # ============================================
  cleanup:
    runs-on: ubuntu-latest
    name: Cleanup
    needs: [e2e-tests, performance]
    if: always()
    
    steps:
    - name: Delete old artifacts
      uses: geekyeggo/delete-artifact@v4
      with:
        name: docker-images
        failOnError: false
