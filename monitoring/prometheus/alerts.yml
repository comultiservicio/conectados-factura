# Prometheus Alert Rules
# Definición de alertas para Conectados Factura+

groups:
  # ============================================
  # Alertas de Servicios
  # ============================================
  - name: services
    interval: 30s
    rules:
      # API Down
      - alert: APIDown
        expr: up{job="factura-app"} == 0
        for: 1m
        labels:
          severity: critical
          service: api
        annotations:
          summary: "API está caída"
          description: "La aplicación API no ha respondido en el último minuto"

      # Nginx Down
      - alert: NginxDown
        expr: up{job="nginx"} == 0
        for: 1m
        labels:
          severity: critical
          service: nginx
        annotations:
          summary: "Nginx está caído"
          description: "El reverse proxy nginx no está disponible"

      # Redis Down
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: high
          service: redis
        annotations:
          summary: "Redis está caído"
          description: "El servicio de cache Redis no responde"

      # Endpoint no responde 200
      - alert: EndpointDown
        expr: probe_success{job="blackbox"} == 0
        for: 2m
        labels:
          severity: high
          service: endpoint
        annotations:
          summary: "Endpoint no responde correctamente"
          description: "El endpoint {{ $labels.instance }} no devuelve HTTP 200"

  # ============================================
  # Alertas de Rendimiento
  # ============================================
  - name: performance
    interval: 30s
    rules:
      # Alta latencia en API
      - alert: HighLatency
        expr: rate(http_request_duration_seconds_sum[5m]) / rate(http_request_duration_seconds_count[5m]) > 1
        for: 5m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "Alta latencia en API"
          description: "La latencia promedio de la API es mayor a 1 segundo"

      # Muchas requests lentas
      - alert: SlowRequests
        expr: rate(http_request_duration_seconds_count{status!~"2.."}[5m]) > 0.1
        for: 3m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "Requests lentas detectadas"
          description: "Hay requests que tardan más de lo normal"

      # CPU alto
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "Uso de CPU alto"
          description: "El uso de CPU ha superado el 80% por más de 5 minutos"

      # Memoria alta
      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "Uso de memoria alto"
          description: "El uso de memoria ha superado el 85%"

      # Disco llenándose
      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
        for: 5m
        labels:
          severity: high
          service: system
        annotations:
          summary: "Espacio en disco bajo"
          description: "Queda menos del 10% de espacio en disco"

  # ============================================
  # Alertas de Base de Datos
  # ============================================
  - name: database
    interval: 30s
    rules:
      # Conexiones altas a SQLite
      - alert: HighDBConnections
        expr: sqlite3_busy_connections > 10
        for: 5m
        labels:
          severity: warning
          service: database
        annotations:
          summary: "Muchas conexiones a la base de datos"
          description: "Hay más de 10 conexiones activas a SQLite"

      # Errores de base de datos
      - alert: DBErrors
        expr: rate(sqlite3_errors_total[5m]) > 0
        for: 2m
        labels:
          severity: high
          service: database
        annotations:
          summary: "Errores en base de datos"
          description: "Se detectaron errores en operaciones de base de datos"

  # ============================================
  # Alertas de Seguridad
  # ============================================
  - name: security
    interval: 30s
    rules:
      # Muchos errores 401 (posible ataque de fuerza bruta)
      - alert: HighAuthFailures
        expr: rate(http_requests_total{status="401"}[5m]) > 5
        for: 3m
        labels:
          severity: high
          service: security
        annotations:
          summary: "Muchos fallos de autenticación"
          description: "Posible ataque de fuerza bruta - muchos 401"

      # Errores 403
      - alert: ForbiddenRequests
        expr: rate(http_requests_total{status="403"}[5m]) > 10
        for: 5m
        labels:
          severity: warning
          service: security
        annotations:
          summary: "Muchos requests prohibidos"
          description: "Hay muchos intentos de acceso no autorizado (403)"

  # ============================================
  # Alertas de Negocio
  # ============================================
  - name: business
    interval: 1m
    rules:
      # No hay facturas creadas hoy (fuera de horario comercial)
      - alert: NoFacturasToday
        expr: facturas_created_today == 0
        for: 4h
        labels:
          severity: info
          service: business
        annotations:
          summary: "No se han creado facturas hoy"
          description: "No se han registrado facturas en las últimas 4 horas"

      # Backup no ejecutado
      - alert: BackupNotRun
        expr: time() - backup_last_success_timestamp > 90000  # 25 horas
        for: 1m
        labels:
          severity: high
          service: backup
        annotations:
          summary: "Backup no ejecutado"
          description: "El último backup se ejecutó hace más de 24 horas"

      # Sync offline con muchos pendientes
      - alert: OfflineSyncBacklog
        expr: offline_sync_pending_count > 50
        for: 30m
        labels:
          severity: warning
          service: sync
        annotations:
          summary: "Muchos cambios pendientes de sincronización"
          description: "Hay {{ $value }} cambios esperando sincronización"
